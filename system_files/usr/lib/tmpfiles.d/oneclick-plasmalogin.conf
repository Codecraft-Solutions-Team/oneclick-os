# Ensure plasma-login-manager state directory and OneClick theme/wallpaper defaults exist with proper ownership.
d /var/lib/plasmalogin 0750 plasmalogin plasmalogin -
d /var/lib/plasmalogin/.config 0700 plasmalogin plasmalogin -
C /var/lib/plasmalogin/.config/kdeglobals 0644 plasmalogin plasmalogin - /usr/share/oneclick/plasmalogin/kdeglobals
C /var/lib/plasmalogin/.config/plasmaloginrc 0644 plasmalogin plasmalogin - /usr/share/oneclick/plasmalogin/plasmaloginrc
Z /var/lib/plasmalogin/.config - plasmalogin plasmalogin -
